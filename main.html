<!DOCTYPE html>
<html>

<head>
    <title>Signup Form</title>
</head>

<body>

    <form method="post">

        <!-- Name -->
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Name" required>

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required>

        <!-- Gender -->
        <label>Gender</label>

        <input type="radio" id="gender_m" name="gender" value="male" required>
        <label for="gender_m">Male</label>

        <input type="radio" id="gender_f" name="gender" value="female" required>
        <label for="gender_f">Female</label>

        <!-- Car Brands -->
        <label for="cars">Car Brands</label>
        <select id="cars" required>
            <option value="">--Please choose an option--</option>
            <option>BMW</option>
            <option>Audi</option>
            <option>Mercedes</option>
            <option>Tesla</option>
        </select>

        <!-- Age -->
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Age" required>

        <!-- DOB -->
        <label for="dob">DOB</label>
        <input type="date" id="dob" required>

        <!-- Phone Number -->
        <label for="tel">Phone Number</label>
        <input type="tel" id="tel" placeholder="xxx-xxx-xxxx">

        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <!-- TOS -->
        <input type="checkbox" id="tos" required>
        <label for="tos">I agree to the TOS</label>

        <!-- Submit -->
        <button type="submit">Submit</button>

    </form>

</body>

</html>
